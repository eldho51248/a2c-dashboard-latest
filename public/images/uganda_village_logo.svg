<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Uganda Village Agricultural Registry Logo">
  <defs>
    <linearGradient id="ugSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="ugField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="ugBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#FCDD09" />
      <stop offset="100%" stop-color="#D80027" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Uganda National Colors Accent -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="url(#ugBorder)" stroke-width="3" />

  <!-- Sun Rays & Golden Sun -->
  <circle cx="50" cy="40" r="22" fill="url(#ugSun)" />

  <!-- Green Rolling Hills & Agricultural Fields -->
  <path d="M6,65 Q30,45 55,60 Q80,75 94,62 L94,90 L6,90 Z" fill="url(#ugField)" />
  <path d="M6,72 Q35,56 60,68 Q82,78 94,70 L94,90 L6,90 Z" fill="#15803D" opacity="0.85" />

  <!-- Sprouting Agricultural Leaf & Spire -->
  <path d="M50,22 Q60,34 50,54 Q40,34 50,22 Z" fill="#4ADE80" stroke="#16A34A" stroke-width="1.5" />
  <path d="M50,22 Q52,38 58,46" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" />

  <!-- Uganda Ribbon Accent in Foreground Base -->
  <path d="M22,80 L78,80 L74,87 L26,87 Z" fill="#000000" />
  <path d="M24,82 L76,82 L74,85 L26,85 Z" fill="#FCDD09" />
  <path d="M26,84 L74,84 L73,86 L27,86 Z" fill="#D80027" />

  <!-- Central Crested Crane Silhouette Accent -->
  <circle cx="50" cy="38" r="4" fill="#FFFFFF" opacity="0.9" />
  <path d="M49,36 L51,36 L52,40 L48,40 Z" fill="#D80027" />
</svg>
