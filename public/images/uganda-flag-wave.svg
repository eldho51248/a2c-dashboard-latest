<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96" role="img" aria-label="Flag of Uganda">
  <defs>
    <!-- Dissolves the hoist edge into the header so the flag reads as part of the ribbon. -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="30%" stop-color="#fff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#fff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="1" />
    </linearGradient>
    <mask id="hoistFade">
      <rect width="340" height="96" fill="url(#fade)" />
    </mask>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="52%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="76%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <clipPath id="flagBody">
      <path d="M0.0,2.6 L4.0,3.5 L8.0,4.3 L12.0,5.3 L16.0,6.2 L20.0,7.1 L24.0,8.1 L28.0,9.0 L32.0,9.9 L36.0,10.7 L40.0,11.6 L44.0,12.3 L48.0,13.1 L52.0,13.7 L56.0,14.3 L60.0,14.8 L64.0,15.2 L68.0,15.5 L72.0,15.7 L76.0,15.9 L80.0,15.9 L84.0,15.9 L88.0,15.8 L92.0,15.6 L96.0,15.4 L100.0,15.0 L104.0,14.6 L108.0,14.2 L112.0,13.7 L116.0,13.2 L120.0,12.6 L124.0,12.0 L128.0,11.4 L132.0,10.9 L136.0,10.3 L140.0,9.8 L144.0,9.3 L148.0,8.8 L152.0,8.4 L156.0,8.1 L160.0,7.8 L164.0,7.6 L168.0,7.5 L172.0,7.4 L176.0,7.5 L180.0,7.6 L184.0,7.8 L188.0,8.1 L192.0,8.5 L196.0,9.0 L200.0,9.6 L204.0,10.2 L208.0,10.9 L212.0,11.7 L216.0,12.5 L220.0,13.3 L224.0,14.2 L228.0,15.2 L232.0,16.1 L236.0,17.0 L240.0,18.0 L244.0,18.9 L248.0,19.8 L252.0,20.6 L256.0,21.4 L260.0,22.2 L264.0,22.9 L268.0,23.5 L272.0,24.1 L276.0,24.6 L280.0,24.9 L284.0,25.2 L288.0,25.5 L292.0,25.6 L296.0,25.6 L300.0,25.6 L304.0,25.4 L308.0,25.2 L312.0,25.0 L316.0,24.6 L320.0,24.2 L324.0,23.7 L328.0,23.2 L332.0,22.7 L336.0,22.1 L340.0,21.6 L340.0,102.6 L336.0,103.1 L332.0,103.7 L328.0,104.2 L324.0,104.7 L320.0,105.2 L316.0,105.6 L312.0,106.0 L308.0,106.2 L304.0,106.4 L300.0,106.6 L296.0,106.6 L292.0,106.6 L288.0,106.5 L284.0,106.2 L280.0,105.9 L276.0,105.6 L272.0,105.1 L268.0,104.5 L264.0,103.9 L260.0,103.2 L256.0,102.4 L252.0,101.6 L248.0,100.8 L244.0,99.9 L240.0,99.0 L236.0,98.0 L232.0,97.1 L228.0,96.2 L224.0,95.2 L220.0,94.3 L216.0,93.5 L212.0,92.7 L208.0,91.9 L204.0,91.2 L200.0,90.6 L196.0,90.0 L192.0,89.5 L188.0,89.1 L184.0,88.8 L180.0,88.6 L176.0,88.5 L172.0,88.4 L168.0,88.5 L164.0,88.6 L160.0,88.8 L156.0,89.1 L152.0,89.4 L148.0,89.8 L144.0,90.3 L140.0,90.8 L136.0,91.3 L132.0,91.9 L128.0,92.4 L124.0,93.0 L120.0,93.6 L116.0,94.2 L112.0,94.7 L108.0,95.2 L104.0,95.6 L100.0,96.0 L96.0,96.4 L92.0,96.6 L88.0,96.8 L84.0,96.9 L80.0,96.9 L76.0,96.9 L72.0,96.7 L68.0,96.5 L64.0,96.2 L60.0,95.8 L56.0,95.3 L52.0,94.7 L48.0,94.1 L44.0,93.3 L40.0,92.6 L36.0,91.7 L32.0,90.9 L28.0,90.0 L24.0,89.1 L20.0,88.1 L16.0,87.2 L12.0,86.3 L8.0,85.3 L4.0,84.5 L0.0,83.6 Z" />
    </clipPath>
  </defs>

  <g mask="url(#hoistFade)">
    <!-- 6 Equal Horizontal Stripes of Uganda Flag: Black, Yellow, Red, Black, Yellow, Red -->
    <!-- Stripe 1: Black -->
    <path d="M0,0 L340,0 L340,16 L0,16 Z" fill="#000000" clip-path="url(#flagBody)"/>
    <!-- Stripe 2: Yellow -->
    <path d="M0,16 L340,16 L340,32 L0,32 Z" fill="#FCDD09" clip-path="url(#flagBody)"/>
    <!-- Stripe 3: Red -->
    <path d="M0,32 L340,32 L340,48 L0,48 Z" fill="#D80027" clip-path="url(#flagBody)"/>
    <!-- Stripe 4: Black -->
    <path d="M0,48 L340,48 L340,64 L0,64 Z" fill="#000000" clip-path="url(#flagBody)"/>
    <!-- Stripe 5: Yellow -->
    <path d="M0,64 L340,64 L340,80 L0,80 Z" fill="#FCDD09" clip-path="url(#flagBody)"/>
    <!-- Stripe 6: Red -->
    <path d="M0,80 L340,80 L340,96 L0,96 Z" fill="#D80027" clip-path="url(#flagBody)"/>

    <!-- Center White Circle for Uganda Emblem -->
    <circle cx="190" cy="48" r="21" fill="#FFFFFF" clip-path="url(#flagBody)"/>

    <!-- Uganda Crested Crane Silhouette Emblem -->
    <g clip-path="url(#flagBody)">
      <!-- Legs & Body -->
      <path d="M185,55 L187,46 L192,44 L196,48 L194,56" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="190" cy="45" rx="6" ry="4" fill="#000000"/>
      <!-- Neck & Head -->
      <path d="M187,43 Q184,38 188,34 Q191,33 192,35 Q190,38 191,42 Z" fill="#000000"/>
      <!-- Red Crown / Crest -->
      <circle cx="187" cy="33" r="2.5" fill="#D80027"/>
      <path d="M185,31 L189,30 L187,34 Z" fill="#FCDD09"/>
      <!-- Tail / Wing -->
      <path d="M192,44 Q197,46 195,50 Q192,48 192,44 Z" fill="#D80027"/>
    </g>

    <!-- Fold shading -->
    <g clip-path="url(#flagBody)">
      <rect width="340" height="96" fill="url(#sheen)" />
    </g>
  </g>
</svg>
